<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 150" width="940" height="150">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
    @keyframes appear {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes colorShift {
        0% { fill: #6ef2ff; }
        33% { fill: #3d7bff; }
        66% { fill: #9d4dff; }
        100% { fill: #6ef2ff; }
    }
    .letter {
        font-family: Arial, sans-serif;
        font-weight: 900;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation:
          appear 0.25s ease forwards,
          colorShift 7.0s linear infinite,
          dna 2.6s ease-in-out infinite;
    }
    .sub {
        font-family: Arial, sans-serif;
        font-weight: 700;
        opacity: 0;
        animation: appear 0.25s ease forwards;
    }

  @keyframes dna {
    0%   { transform: translateY(0px) rotate(0deg); }
    30%  { transform: translateY(-9px) rotate(6deg); }
    50%  { transform: translateY(0px) rotate(0deg); }
    80%  { transform: translateY(9px) rotate(-6deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }
    </style>
  </defs>
  <rect width="940" height="150" fill="#0a0a14"/>
